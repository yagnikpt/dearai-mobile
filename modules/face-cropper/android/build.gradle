apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/VisionCameraFaceCropper+autolinking.gradle'

android {
  namespace 'com.margelo.nitro.camera.facecropper'
  compileSdkVersion rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    externalNativeBuild {
      cmake {
        arguments '-DANDROID_STL=c++_shared'
      }
    }
  }

  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
    }
  }

  buildFeatures { prefab true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  compileOnly 'com.facebook.react:react-android'
  implementation 'androidx.annotation:annotation:1.9.1'
  // NativeFrame exposes CameraX's ImageProxy in its public Android contract.
  implementation 'androidx.camera:camera-core:1.7.0-alpha02'
  compileOnly project(':react-native-nitro-modules')
  compileOnly project(':react-native-vision-camera')
}
